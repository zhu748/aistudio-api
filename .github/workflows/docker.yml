name: Docker

on:
  # 推送与 PR 都构建：验证 Dockerfile 改动，避免镜像只在每日定时任务里
  # 才被真正编译一次（旧写法 latest 滞后 24h、Dockerfile 错误长期不暴露）。
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_REPO: bedrockblock/aistudio-api

jobs:
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ghcr.io 要求仓库名全小写；github.repository 可能含大写字母
      # （例如 DeconstructedCube），直接拼进镜像引用会报
      # "invalid reference format: repository name must be lowercase"。
      - name: Compute lowercase GHCR repository
        run: |
          echo "GHCR_REPO=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Docker Hub 凭证是可选的：未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
      # secrets 时（fork、或仅用 GHCR 的部署）优雅降级为只推 GHCR，
      # 而不是在登录一步硬性失败导致连 GHCR 镜像也发不出去。
      - name: Detect Docker Hub credentials
        id: dh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Docker Hub skipped::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets 未配置，本次只发布到 GHCR。"
          fi

      - name: Compute image list
        run: |
          {
            echo "IMAGES<<EOF"
            echo "${GHCR_REPO}"
            if [ "${{ steps.dh.outputs.available }}" = "true" ]; then
              echo "${DOCKERHUB_REPO}"
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGES }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref_name == 'main' || github.ref_name == 'master' }}

      # PR 只构建不登录、不推送：既验证 Dockerfile，又不让 fork PR 拿到
      # 仓库 secrets / packages: write 权限。
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.dh.outputs.available == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
