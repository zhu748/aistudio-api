name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Path Filters
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'src/aistudio_api/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'requirements.txt'
              - 'main.py'
              - 'defaults/**'
              - 'config.yaml'
              - 'render.yaml'
              - 'Dockerfile'
              - 'docker-entrypoint.sh'
              - 'docker-compose*.yml'
              - 'scripts/**'
              - '.env.example'
              - '.gitattributes'
              - '.github/workflows/ci.yml'
            frontend:
              - 'web/**'
              - 'scripts/verify_static_assets.mjs'
              - '.github/workflows/ci.yml'

  backend-check:
    name: Backend Quality & Tests
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"

      - name: Run Ruff Lint
        run: uv run --no-sync ruff check .

      - name: Run Ruff Format Check
        run: uv run --no-sync ruff format --check .

      - name: Run Pyright Type Check
        run: uv run --no-sync pyright src tests

      - name: Run Pytest Suite
        run: uv run --no-sync pytest

  frontend-check:
    name: Frontend Quality & Build
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Run TypeScript Type Check
        run: bun run type-check

      - name: Run ESLint
        run: bun run lint

      - name: Preserve Committed Static Assets
        working-directory: .
        run: cp -a src/aistudio_api/static "$RUNNER_TEMP/aistudio-api-committed-static"

      - name: Verify Web Production Build
        run: bun run build

      - name: Verify Committed Static Assets Match Build Content
        working-directory: .
        run: bun scripts/verify_static_assets.mjs src/aistudio_api/static "$RUNNER_TEMP/aistudio-api-committed-static"
