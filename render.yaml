# Render Blueprint — 一键部署 aistudio-api 到 Render（默认 Free / 无磁盘）
#
# 使用方法：
#   1. 将本仓库推送到 GitHub/GitLab
#   2. Render 控制台 → New → Blueprint → 选择该仓库
#   3. 首次部署会提示填写 sync:false 的密钥变量（面板密码、Cookie、代理等）
#
# 计划说明（默认 Free / 无磁盘）：
#   - Free 计划 512MB 内存、无持久磁盘：容器重启 / 重新部署 / 15 分钟无流量
#     休眠后，/app/data 下的面板配置、调用统计与 UI 导入账号全部清空。
#     重启就重启 —— 账号凭据放在环境变量里，每次启动自动重建（幂等注入）。
#   - 账号请用 AISTUDIO_COOKIES 注入：支持多条、每条可带独立代理，
#     重启后自动恢复，无需磁盘。
#   - 面板里的 config.yaml 修改不持久 —— 需要固化的配置（默认模型、抗截断、
#     签名器选择等）请用对应环境变量下发。
#   - 512MB 内存可正常部署：本引擎无需浏览器，纯 Go + SpiderMonkey 本地签名。
#     若内存吃紧，设置 AISTUDIO_WAA_SERVER=remote_spinsnow 改走远程签名器，
#     跳过本地引擎进程（省约 100~200MB；Free 计划面板切换不持久，
#     必须用环境变量）。
#   - 需要持久磁盘与服务常驻（不休眠）时：plan 改回 starter，并恢复下方
#     注释中的 disk 段。

services:
  - type: web
    name: aistudio-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz

    # 持久磁盘（Free 计划不支持；starter 及以上取消注释即可启用）：
    # disk:
    #   name: aistudio-data
    #   mountPath: /app/data
    #   sizeGB: 1

    # 监听端口由 Render 注入的 PORT 环境变量决定（entrypoint 自动映射）。
    envVars:
      # 【必填】Web 管理面板登录密码 —— 公网部署务必设置，否则面板裸奔
      - key: AISTUDIO_WEB_PASSWORD
        sync: false
      # 【推荐】API 调用鉴权 Key（防止 /v1beta 接口被白嫖）。
      # 多个用逗号/换行分隔或 JSON 数组，例: sk-aaa,sk-bbb
      # 与 config.yaml 中面板创建的 Key 合并生效，重启后自动恢复。
      - key: AISTUDIO_API_KEYS
        sync: false
      # 【推荐】账号 Cookie 注入（免磁盘，重启自动恢复）。
      # 多条用换行分隔；单条支持三种格式（+ 为分隔符）：
      #   代理+Cookie   socks5://user:pass@host:port+SID=xxx; HSID=yyy
      #   Cookie        SID=xxx; HSID=yyy（走全局 AISTUDIO_PROXY）
      #   Cookie+代理   SID=xxx; HSID=yyy+http://host:port
      # 也可直接粘贴 Cookie-Editor 导出的 JSON 数组。
      - key: AISTUDIO_COOKIES
        sync: false
      # 【可选】第二个账号；更多账号可在 Render 面板继续添加
      # AISTUDIO_COOKIES_3、AISTUDIO_COOKIES_4 ...（编号变量逐条注入）
      - key: AISTUDIO_COOKIES_2
        sync: false
      # 【可选】出站代理（http:// 或 socks5://），Google 风控严格时使用
      # 例: socks5://user:pass@host:port
      - key: AISTUDIO_PROXY
        sync: false
      # 【可选】强制覆盖抗截断全局开关（1/0；留空跟随面板 config.yaml）
      - key: AISTUDIO_ANTI_TRUNCATION
        sync: false
      # 【可选】默认文本模型
      - key: AISTUDIO_DEFAULT_TEXT_MODEL
        sync: false
      # 【Free 计划推荐】固定走远程 WAA 签名器：跳过本地签名引擎进程
      # （省约 100~200MB 内存）；面板切换在 Free 计划不持久，必须用环境变量。
      - key: AISTUDIO_WAA_SERVER
        sync: false
