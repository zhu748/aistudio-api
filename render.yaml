# Render Blueprint — 一键部署 aistudio-api 到 Render（默认 Free / 无磁盘）
#
# 使用方法：
#   1. 将本仓库推送到 GitHub/GitLab
#   2. Render 控制台 → New → Blueprint → 选择该仓库
#   3. 首次部署会提示填写 sync:false 的密钥变量（面板密码、Cookie、代理等）
#
# 计划说明（默认 Free / 无磁盘）：
#   - Free 计划 512MB 内存、无持久磁盘：容器重启 / 重新部署 / 15 分钟无流量
#     休眠后，/app/data 下的面板配置、调用统计与 UI 导入账号全部清空。
#     重启就重启 —— 账号凭据放在环境变量里，每次启动自动重建（幂等注入）。
#   - 账号请用 AISTUDIO_COOKIES 注入：支持多条、每条可带独立代理，
#     重启后自动恢复，无需磁盘。
#   - 面板里的 config.yaml 修改不持久 —— 需要固化的配置（默认模型、抗截断
#     等）请用对应环境变量下发。
#   - 512MB 内存可正常部署：本引擎无需浏览器，纯 Go + SpiderMonkey 本地签名
#     （本地引擎是唯一签名方式，无远程节点选项）。
#   - 长代理会话（Claude Code 等 harness）的内存自适应：进程按 cgroup 预算
#     自动缩放缓存上限（512MB 档下 model_turns 回放缓存 64MB→12MB），大请求
#     收尾后归还 glibc 堆碎片，避免长会话把 RSS 顶过 OOM 阈值被 SIGKILL
#     （OOM 崩溃重启同样会清空临时盘数据）。可用 AISTUDIO_MEMORY_BUDGET_MB /
#     AISTUDIO_MODEL_TURN_CACHE_MB 显式调节；AISTUDIO_MALLOC_TRIM=0 关闭堆归还。
#   - 面板里的「上游成功快照」开关不持久：Free 档无磁盘，重启后 /app/data 清空，
#     entrypoint 发现 config.yaml 不在就用镜像内 defaults/config.yaml（该值
#     为 10）重建——也就是说面板改成 0 后第一次 OOM 重启就悄悄回到 10，之后
#     每次成功请求都在线程池里再复制 3～4 倍正文。要真正关掉必须用下面的
#     环境变量。
#   - 排障：GET /memory（面板密码鉴权，与 /stats 同为顶层路径）返回主进程/
#     子进程 RSS 与 cgroup 用量；启动日志「分配器姿态」一行可见
#     MALLOC_ARENA_MAX 是否生效。
#   - 需要持久磁盘与服务常驻（不休眠）时：plan 改回 starter，并恢复下方
#     注释中的 disk 段。

services:
  - type: web
    name: aistudio-api
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz

    # 持久磁盘（Free 计划不支持；starter 及以上取消注释即可启用）：
    # disk:
    #   name: aistudio-data
    #   mountPath: /app/data
    #   sizeGB: 1

    # 监听端口由 Render 注入的 PORT 环境变量决定（entrypoint 自动映射）。
    envVars:
      # 长工具调用 / 缓冲生成：SSE 和非流式 JSON 默认均启用保活。
      - key: AISTUDIO_STREAM_HEARTBEAT_INTERVAL
        value: "15"
      - key: AISTUDIO_NONSTREAM_KEEPALIVE
        value: "1"
      - key: AISTUDIO_UPSTREAM_READ_TIMEOUT
        value: "300"
      - key: AISTUDIO_REQUEST_TIMEOUT
        value: "600"
      # 关闭上游成功快照（面板改不持久：重启即被 defaults 覆盖回 10）。
      # 长会话每轮请求体 MB 级，快照线程整体解析+序列化会放大 3～4 倍正文。
      # 需要抓错误现场时不受影响：失败快照不受此开关限制。
      - key: AISTUDIO_UPSTREAM_SNAPSHOT_KEEP
        value: "0"
      # 显式告知 512MB 预算：缓存分档（model_turns 64MB→12MB 等）依赖 cgroup
      # 探测，Render 的容器运行时不保证暴露 memory.max；探测失败会静默回退
      # 大内存默认档，长会话峰值直接多出 ~50MB。升级套餐时同步修改或删除
      # （删除 = 按 cgroup 自动探测）。启动日志「内存预算」一行可核对。
      - key: AISTUDIO_MEMORY_BUDGET_MB
        value: "512"
      # 【必填】Web 管理面板登录密码 —— 公网部署务必设置，否则面板裸奔
      - key: AISTUDIO_WEB_PASSWORD
        sync: false
      # 【推荐】API 调用鉴权 Key（防止 /v1beta 接口被白嫖）。
      # 多个用逗号/换行分隔或 JSON 数组，例: sk-aaa,sk-bbb
      # 与 config.yaml 中面板创建的 Key 合并生效，重启后自动恢复。
      - key: AISTUDIO_API_KEYS
        sync: false
      # 【推荐】账号 Cookie 注入（免磁盘，重启自动恢复）。
      # 多条用换行分隔；单条支持三种格式（+ 为分隔符）：
      #   代理+Cookie   socks5://user:pass@host:port+SID=xxx; HSID=yyy
      #   Cookie        SID=xxx; HSID=yyy（走全局 AISTUDIO_PROXY）
      #   Cookie+代理   SID=xxx; HSID=yyy+http://host:port
      # 也可直接粘贴 Cookie-Editor 导出的 JSON 数组。
      - key: AISTUDIO_COOKIES
        sync: false
      # 【可选】第二个账号；更多账号可在 Render 面板继续添加
      # AISTUDIO_COOKIES_3、AISTUDIO_COOKIES_4 ...（编号变量逐条注入）
      - key: AISTUDIO_COOKIES_2
        sync: false
      # 【可选】出站代理（http:// 或 socks5://），Google 风控严格时使用
      # 例: socks5://user:pass@host:port
      - key: AISTUDIO_PROXY
        sync: false
      # 【可选】强制覆盖抗截断全局开关（1/0；留空跟随面板 config.yaml）
      - key: AISTUDIO_ANTI_TRUNCATION
        sync: false
      # 【可选】默认文本模型
      - key: AISTUDIO_DEFAULT_TEXT_MODEL
        sync: false
